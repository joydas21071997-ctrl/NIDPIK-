name: Deploy to Firebase Hosting on push

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # actions/setup-node crashes with "Dependencies lock file is not found"
      # when package-lock.json is absent, so only enable the npm cache when
      # the lock file actually exists in the checked-out tree.
      - name: Check npm lock file
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::package-lock.json is not tracked in git. npm cache disabled; a lock file will be generated during install. Commit package-lock.json to restore caching and reproducible installs."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ steps.lock.outputs.present == 'true' && 'npm' || '' }}

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Production Frontend
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build finished but dist/index.html was not produced. Check the 'public' directory in firebase.json and the vite build output."
            exit 1
          fi
          echo "dist/index.html present, deploying:"

      - name: Deploy to Firebase Hosting Live Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0205908126 }}'
          projectId: gen-lang-client-0205908126
          channelId: live
